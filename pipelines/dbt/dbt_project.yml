name: bolivia_pharma_price_engine
version: "1.0.0"
config-version: 2
profile: bolivia_pharma_price_engine

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

models:
  bolivia_pharma_price_engine:
    silver:
      staging:
        +materialized: view
      intermediate:
        +materialized: view
    gold:
      marts:
        +materialized: table

seeds:
  bolivia_pharma_price_engine:
    +quote_columns: false
    product_categories:
      +column_types:
        category_id: number(38, 0)
        category_group: varchar
        category_name: varchar
        atc_scope: varchar
        examples: varchar
