[project]
name = "bolivia-pharma-price-engine"
version = "0.1.0"
description = "Track Bolivian pharmacy prices and compare trends with USD/BOB exchange rates"
requires-python = ">=3.11"
dependencies = [
    "azure-storage-blob>=12.31.1",
    "playwright>=1.64.1",
    "pyarrow>=26.0.0",
]

[dependency-groups]
airflow = [
    "apache-airflow[fab,postgres]==3.3.2",
    "apache-airflow-providers-snowflake==6.20.0",
    "tenacity<9.2",
    "websockets<17",
    "importlib-metadata<9",
    "filelock<4",
    "botocore>=1.43.66,<1.43.76",
    "opentelemetry-sdk~=1.44.0",
]
dbt = [
    "dbt-snowflake==1.12.5",
]
